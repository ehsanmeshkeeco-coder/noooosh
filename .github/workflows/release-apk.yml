name: Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    env:
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || vars.CLERK_SECRET_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Environment Files
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || vars.CLERK_SECRET_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          CLERK_VAL="${CLERK_PUBLISHABLE_KEY:-pk_test_aGVyb2ljLWdyb3VzZS0xODA3LmNsZXJrLmFjY291bnRzLmRldiQ}"
          CLERK_SEC="${CLERK_SECRET_KEY:-}"
          SUPA_URL="${SUPABASE_URL:-https://hpdbgwpfhiwcipixdfer.supabase.co}"
          SUPA_ANON="${SUPABASE_ANON_KEY:-sb_publishable_EJyS9Tmjpb8yemN5IPUotA_Lo5ndCZD}"
          SUPA_SERVICE="${SUPABASE_SERVICE_ROLE_KEY:-}"

          sed -i '/^CLERK_PUBLISHABLE_KEY=/d' .env || true
          echo "CLERK_PUBLISHABLE_KEY=$CLERK_VAL" >> .env

          sed -i '/^CLERK_SECRET_KEY=/d' .env || true
          if [ -n "$CLERK_SEC" ]; then
            echo "CLERK_SECRET_KEY=$CLERK_SEC" >> .env
          fi

          sed -i '/^SUPABASE_URL=/d' .env || true
          echo "SUPABASE_URL=$SUPA_URL" >> .env

          sed -i '/^SUPABASE_ANON_KEY=/d' .env || true
          echo "SUPABASE_ANON_KEY=$SUPA_ANON" >> .env

          sed -i '/^SUPABASE_SERVICE_ROLE_KEY=/d' .env || true
          if [ -n "$SUPA_SERVICE" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY=$SUPA_SERVICE" >> .env
          fi

          # Export into GITHUB_ENV so all subsequent steps receive them
          echo "CLERK_PUBLISHABLE_KEY=$CLERK_VAL" >> $GITHUB_ENV
          echo "CLERK_SECRET_KEY=$CLERK_SEC" >> $GITHUB_ENV
          echo "SUPABASE_URL=$SUPA_URL" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=$SUPA_ANON" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SUPA_SERVICE" >> $GITHUB_ENV

      - name: Setup Google Services JSON
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p app
          if [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
            echo "$GOOGLE_SERVICES_JSON_SECRET" | base64 --decode > app/google-services.json 2>/dev/null || echo "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
          elif [ -f "app/google-services.json.base64" ]; then
            base64 --decode app/google-services.json.base64 > app/google-services.json 2>/dev/null || cat app/google-services.json.base64 > app/google-services.json
          fi

      - name: Setup Keystores
        env:
          RELEASE_KEYSTORE_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_SECRET" ]; then
            echo "$RELEASE_KEYSTORE_SECRET" | base64 --decode > release.keystore
          elif [ -f "release.keystore.base64" ]; then
            base64 --decode release.keystore.base64 > release.keystore 2>/dev/null || cat release.keystore.base64 > release.keystore
          fi
          if [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore 2>/dev/null || base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || 'noosh123456' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || 'upload' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || 'noosh123456' }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || vars.CLERK_SECRET_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Signed Release Bundle (AAB)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.STORE_PASSWORD || 'noosh123456' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || 'upload' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || 'noosh123456' }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY || vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || vars.CLERK_SECRET_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: noosh-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release Bundle (AAB) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: noosh-release-bundle
          path: app/build/outputs/bundle/release/*.aab

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
